# config/daily_macro_consolidated.yaml
# Observation-only ceilings and label maps for daily_macro_consolidated.py
# Not constitutional kernel constants.
#
# Production posture (2026-08 backtests):
#   D-enhancement: denom state binds with exit hysteresis
#   Frozen C: tech dampener SOXX tiers untouched
#   rates: soft/diagnostic (bind_mode=shadow)

version: "1"
schema: "macro-os.daily-macro-consolidated.v5-d-enhancement"

stale_fallback_max_trading_days: 1

denominator_ceilings:
  # ordered via core.denom_ceiling explicit Pine map first, then keywords
  crisis:
    keywords: ["HARD_VETO", "CRISIS", "LIQUIDITY_SQUEEZE", "SQUEEZE", "危机", "信用传导", "仓位主导"]
    ceiling: 0.10
  tight:
    keywords: ["RISK_OFF", "TIGHT", "TRANSITION", "紧缩", "压力", "偏紧", "过渡", "久期压力", "美元压力"]
    ceiling: 0.35
  unconfirmed:
    keywords: ["UNCONFIRMED", "未确认", "分裂", "横盘", "混合", "预热"]
    ceiling: 0.55
  risk_on:
    keywords: ["RISK_ON", "宽松", "分母端宽松"]
    ceiling: 0.80
  default: 0.55

# D-enhancement: bind denom ceiling; exit looser only after confirm_exit days
denom_policy:
  bind: true
  confirm_enter: 1
  confirm_exit: 3
  persist_hysteresis: true

theme_ceilings:
  missing: null
  pressure_override: 0.25
  risk_off: 0.45
  risk_on: 0.80
  default: 0.60

tech_default_ceiling: 0.80
tech_policy:
  mode: frozen_c_tier
  note: "SOXX -13/-10/-7 -> 0.35/0.50/0.65 remains in dampener/kernel; do not retune here"

tech_stress_bands:
  strong: 0.35
  medium: 0.50
  light: 0.65

nq_ceilings:
  missing: null
  veto: 0.20
  risk_off: 0.40
  mixed: 0.55
  risk_on: 0.75
  default: 0.60

# Rates: diagnostic by default. Options: shadow | b_zone_only | hard | off
rates_stress:
  enabled: true
  bind_mode: shadow
  z_enter: 1.0
  pct_enter: 97.0
  confirm_days: 2
  exit_days: 3
  cap_level_only: 0.65
  cap_slope_level: 0.55
  cap_extreme: 0.45
  z_extreme: 1.75
  tlt_z_confirm: 0.0
  b_zone_cap: 0.65
