# config/daily_macro_consolidated.yaml
# Observation-only ceilings for daily_macro_consolidated.py
# Not constitutional kernel constants.
#
# Production posture:
#   D-enhancement: denom bind + exit hysteresis
#   Frozen C: tech dampener SOXX tiers untouched
#   rates: soft/diagnostic (bind_mode=shadow)
#   PPO: positioning path flag_only by default

version: "1"
schema: "macro-os.daily-macro-consolidated.v5-ppo"

stale_fallback_max_trading_days: 1

denominator_ceilings:
  # Scheme C: split hard credit crisis vs liquidity squeeze floors
  crisis:
    keywords: ["HARD_VETO", "CRISIS", "危机", "信用传导", "仓位主导"]
    ceiling: 0.10
  squeeze:
    keywords: ["LIQUIDITY_SQUEEZE", "SQUEEZE", "流动性挤兑", "挤兑"]
    ceiling: 0.20
  tight:
    keywords: ["RISK_OFF", "TIGHT", "TRANSITION", "紧缩", "压力", "偏紧", "过渡", "久期压力", "美元压力"]
    ceiling: 0.35
  unconfirmed:
    keywords: ["UNCONFIRMED", "未确认", "分裂", "横盘", "混合", "预热"]
    ceiling: 0.55
  risk_on:
    keywords: ["RISK_ON", "宽松", "分母端宽松"]
    ceiling: 0.80
  default: 0.55

denom_policy:
  bind: true
  confirm_enter: 1
  confirm_exit: 2
  crisis_exit: 2
  squeeze_exit: 2
  persist_hysteresis: true

theme_ceilings:
  missing: null
  pressure_override: 0.25
  risk_off: 0.45
  risk_on: 0.80
  default: 0.60

tech_default_ceiling: 0.80
tech_policy:
  mode: frozen_c_tier
  note: "SOXX -13/-10/-7 -> 0.35/0.50/0.65; do not retune here"

tech_stress_bands:
  strong: 0.35
  medium: 0.50
  light: 0.65

nq_ceilings:
  missing: null
  veto: 0.20
  risk_off: 0.40
  mixed: 0.55
  risk_on: 0.75
  default: 0.60

rates_stress:
  enabled: true
  bind_mode: shadow
  z_enter: 1.0
  pct_enter: 97.0
  confirm_days: 2
  exit_days: 3
  cap_level_only: 0.65
  cap_slope_level: 0.55
  cap_extreme: 0.45
  z_extreme: 1.75
  tlt_z_confirm: 0.0
  b_zone_cap: 0.65

positioning_path:
  enabled: true
  mode: flag_only
  z_dead: 0.5
  z_enter: 1.0
  nq_break_ret_20: -0.05
  nq_lead_eps: 0.0
  require_lh_ll_for_deteriorate: true
  swing_left: 2
  swing_right: 2
  swing_lookback: 60
  soft_cap_deteriorate: 0.55
  soft_cap_bad_ease: 0.45
  confirm_days: 2
  exit_days: 2
  deteriorate_confirm_days: 3

re_risk:
  enabled: true
  offense_cap: 0.80
  max_step_up: 0.15
  step_confirm_days: 2
  min_hold_after_up_days: 1
  tech_min_for_permit: 0.50
  require_not_lh_ll: true
  require_ret20_nonneg: true
  block_both_tight: true
  block_ppo_block_add: true
  permit_tiers: ["unconfirmed", "risk_on", "default"]
  # Scheme C companion: never let defense path sit below floor when only squeeze
  defense_floor: 0.0

